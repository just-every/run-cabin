<!doctype html><html lang="en"><meta charset="utf-8"><title>Host calendar · Lake Loft</title>
<style>body{font:18px system-ui;margin:36px;background:#f8f9f6;color:#243b32}header,main{max-width:920px;margin:auto}button{padding:14px;margin:10px 10px 10px 0;font:inherit}td{padding:20px;border:1px solid #afbab1}table{border-collapse:collapse}input{display:block;margin:8px;padding:12px}#challenge{padding:24px;background:white}</style>
<header><h1>Lake Loft</h1><p>Host calendar · Reservations · Listings · Availability</p></header><main id="main"></main>
<script>
const params=new URLSearchParams(location.search),mode=params.get('mode'),main=document.getElementById('main');
if(mode==='captcha')main.innerHTML='<section id="challenge"><h2>Verify you are human</h2><div class="captcha">Complete the CAPTCHA to continue.</div><button>Continue</button></section>';
else if(mode==='2fa')main.innerHTML='<section id="challenge"><h2>Two-factor authentication</h2><label>Enter the verification code<input autocomplete="one-time-code"></label><button>Continue</button></section>';
else if(!document.cookie.includes('host_session=')){
 main.innerHTML='<form><h2>Sign in to manage your account</h2><label>Email<input name="email" type="email"></label><label>Password<input type="password" name="password"></label><button>Sign in</button></form>';
 main.querySelector('form').onsubmit=e=>{e.preventDefault();document.cookie='host_session=recorded-channel-session; path=/; Secure; SameSite=Lax';location.reload()};
}else{
 const dates=['2026-12-10','2026-12-11','2026-12-12'];const states=JSON.parse(localStorage.getItem('nights')||'{}');
 main.innerHTML='<h2>December 2026</h2><p>Selected listing: Lake Loft · Entire home</p><table><tr>'+dates.map(date=>'<td data-date="'+date+'" data-state="'+(states[date]||'open')+'">'+date+' · '+(states[date]||'open')+'</td>').join('')+'</tr></table><button id="close">Block selected nights</button><button id="open">Reopen selected nights</button><p role="status">Changes are saved to this listing.</p>';
 for(const kind of ['close','open'])document.getElementById(kind).onclick=()=>{for(const date of dates)states[date]=kind==='close'?'closed':'open';localStorage.setItem('nights',JSON.stringify(states));location.reload()};
}
</script></html>
